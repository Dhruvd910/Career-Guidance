  # ---------------- design, architecture, planning ----------------
  - key: degree:barch
    name: {en: B.Arch, hi: बी.आर्क}
    attrs:
      level: UG
      duration_years: 5
      regulator: Council of Architecture
      programmes: [{course: "^B\\.Arch"}]
    edges:
      requires_subject: [{to: subject:mathematics, mandatory: true}, {to: subject:physics, mandatory: true}, {to: subject:chemistry, mandatory: true}]
      requires_exam: [exam:NATA, {to: exam:JEE_MAIN, note: "Paper 2A"}]
      continues_to: [degree:mtech_ms]
  - key: degree:bplan
    name: {en: B.Planning, hi: बी.प्लानिंग}
    attrs:
      level: UG
      duration_years: 4
      programmes: [{course: "^B\\.Plan"}]
    edges:
      requires_subject: [{to: subject:mathematics, mandatory: true}]
      requires_exam: [{to: exam:JEE_MAIN, note: "Paper 2B"}]
