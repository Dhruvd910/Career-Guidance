# Degrees: what they require at class 12 (requires_subject: mandatory, or one_of a group, or a
# recommendation with a note), which entrance exams lead to them, what can follow (continues_to),
# and — for degrees in the official JoSAA/MCC 2026 data — which programme names are theirs
# (programmes: course/branch patterns, checked in match_order, first match wins; the loader
# reports any programme that matches nothing).
# Curated by MAYA's editor (Claude), not yet reviewed by a person. Requirements vary by college
# and change; students should confirm with the official admission notice.
source: {kind: curated, ref: maya_editorial_v1}
nodes:
